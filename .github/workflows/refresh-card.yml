name: Refresh profile card

on:
  schedule:
    - cron: "17 19 * * *"   # daily, around 6am Sydney time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_ascii_card.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild card with live GitHub numbers
        run: python scripts/build_ascii_card.py --card-only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Refresh profile card" && git push)
